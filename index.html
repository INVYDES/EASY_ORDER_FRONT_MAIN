  <!-- Pantalla de carga inicial: se sustituye cuando Vue monta. Sin JS externo. -->
  <style>
    .eo-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #0b1220;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      z-index: 9999;
    }
    .eo-splash-logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: #fff;
    }
    .eo-splash-logo i { font-style: normal; color: #818cf8; }
    .eo-splash-bar {
      width: 190px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .14);
      overflow: hidden;
    }
    .eo-splash-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed, #db2777);
      animation: eo-splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes eo-splash-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .eo-splash-bar span { animation: none; width: 100%; }
    }

  </style>

  <!-- Modo oscuro anticipado: evita el destello blanco si el visitante ya
       eligió tema oscuro (la clase exacta la confirma utils/tema.ts). -->
  <script>
    try {
      var prefs = JSON.parse(localStorage.getItem('eorder:preferencias') || '{}');
      var oscuro = prefs.tema === 'oscuro' ||
        (!prefs.tema && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (oscuro) {
        document.documentElement.classList.add('tema-oscuro');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b1220');
      }
    } catch (e) { /* almacenamiento bloqueado */ }
  </script>

        <div class="eo-splash-bar"><span></span></div>
