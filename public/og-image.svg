<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="eOrder — Sistema de gestión para restaurantes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131f36"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".15" r=".9">
      <stop offset="0" stop-color="#4f46e5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Blob decorativo -->
  <circle cx="1050" cy="520" r="220" fill="#7c3aed" opacity=".14"/>
  <circle cx="180" cy="80" r="160" fill="#4f46e5" opacity=".12"/>

  <!-- Logo wordmark -->
  <g transform="translate(80 92)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#acento)"/>
    <text x="28" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">e</text>
    <text x="70" y="40" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Order</text>
    <text x="72" y="66" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#818cf8">EASY ORDER</text>
  </g>

  <!-- Titular -->
  <text x="80" y="330" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#f1f5ff">El sistema todo en uno</text>
  <text x="80" y="404" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#f1f5ff">para tu <tspan fill="#a5b4fc">restaurante</tspan></text>

  <!-- Subtítulo -->
  <text x="80" y="462" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#b6c2d9">POS · Cocina (KDS) · Barra · Caja · Administración</text>

  <!-- CTA falso (decorativo) -->
  <g transform="translate(80 512)">
    <rect width="330" height="58" rx="14" fill="url(#acento)"/>
    <text x="165" y="37" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Prueba 30 días gratis</text>
  </g>
  <text x="440" y="550" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#8fa0bd">eorder.mx</text>
</svg>
