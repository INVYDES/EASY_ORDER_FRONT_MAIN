server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /cws/eorder_b/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /cws/eorder_b/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
